name: build

on:
  push:
  workflow_dispatch:

jobs:
  nro:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Diagnostico del entorno
        run: |
          echo "DEVKITPRO=$DEVKITPRO"
          ls "$DEVKITPRO" || true
          ls "$DEVKITPRO/portlibs/switch" || true

      - name: Instalar librerias de Switch
        run: |
          PM=$(command -v dkp-pacman || command -v pacman)
          $PM -Syu --noconfirm
          $PM -S --noconfirm switch-sdl2 switch-mesa switch-libdrm_nouveau switch-zlib switch-libpng

      - name: Diagnostico de librerias
        run: |
          ls "$DEVKITPRO/portlibs/switch/bin" || true
          ls "$DEVKITPRO/portlibs/switch/lib" | head -50 || true

      - name: Compilar
        run: make

      - uses: actions/upload-artifact@v4
        with:
          name: mkxp-nx-hito1
          path: mkxp-nx.nro
